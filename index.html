                var filteredData = jsonData.filter(row => row.some(filledCell));

                return csv;

                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";

// Función para calcular similitud entre dos cadenas (distancia de Levenshtein simplificada)
function getSimilarity(str1, str2) {
  const len1 = str1.length;
  const len2 = str2.length;
  if (len1 === 0) return len2;
  if (len2 === 0) return len1;

  const matrix = Array(len2 + 1).fill(null).map(() => Array(len1 + 1).fill(null));

  for (let i = 0; i <= len1; i++) matrix[0][i] = i;
  for (let j = 0; j <= len2; j++) matrix[j][0] = j;

  for (let j = 1; j <= len2; j++) {
    for (let i = 1; i <= len1; i++) {
      const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
      matrix[j][i] = Math.min(
        matrix[j][i - 1] + 1, // inserción
        matrix[j - 1][i] + 1, // eliminación
        matrix[j - 1][i - 1] + indicator // sustitución
      );
    }
  }

  return matrix[len2][len1];
}

// Función para calcular umbral dinámico
function getDynamicThreshold(str) {
  return str.length <= 5 ? 1 : Math.max(2, Math.ceil(str.length * 0.25)); // Más flexible para modelos largos
}

// Función para generar combinaciones de palabras
function getWordCombinations(words) {
  const combinations = [];
  for (let i = 0; i < words.length; i++) {
    for (let j = i + 1; j <= words.length && j <= i + 4; j++) { // Máximo 4 palabras
      combinations.push(words.slice(i, j).join(" "));
    }
  }
  return combinations;
}

// Función para normalizar texto
function normalizeText(text) {
  // Eliminar saludos y palabras irrelevantes
  const irrelevantWords = ["buen", "dia", "tarde", "noches", "disculpe", "perdone", "seño", "señores", "tendrá", "tendran", "cotizar", "busco", "ando", "buscando", "necesito", "quisiera", "consulta", "por", "favor", "gracias", "tendrias", "tendra", "ustedes", "venden"];
  let cleanText = text.toLowerCase();
  irrelevantWords.forEach(word => {
    cleanText = cleanText.replace(new RegExp(`\\b${word}\\b`, "g"), "");
  });
  return cleanText
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s-]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

// Función para aplicar correcciones de marcas y modelos
function applyCorrections(text) {
  let correctedText = text.toLowerCase();
  for (const key in correccionesMarcasModelos) {
    const keyNormalizado = normalizeText(key);
    const replacement = normalizeText(correccionesMarcasModelos[key]);
    if (correctedText.includes(keyNormalizado)) {
      correctedText = correctedText.replace(keyNormalizado, replacement);
      console.log(`Corrección aplicada: "${keyNormalizado}" -> "${replacement}"`);
    }
  }
  return correctedText;
}

  for (const key in correccionesProductos) {

  if (productoDetectado === "no detectado") {
    for (const prod of productos) {

  if (amortiguadorSynonyms.includes(productoDetectado) || productoDetectado === "amortiguador") {

  // Detección de modelo y marca
  const words = mensajeNormalizado.split(/\s+/);

  let bestSimilarityModelo = Infinity;
  for (const marca in marcasModelos) {
    for (const modelo of marcasModelos[marca]) {
      const modeloNormalizado = normalizeText(modelo);
      const threshold = getDynamicThreshold(modeloNormalizado);
      if (mensajeNormalizado.includes(modeloNormalizado)) {
        bestMatchModelo = modelo;
        marcaDetectada = marca;
        console.log(`Modelo detectado (exacto): "${modelo}" para marca "${marca}"`);

      for (const combination of wordCombinations) {
        const similarity = getSimilarity(normalizeText(combination), modeloNormalizado);
        console.log(`Comparando "${combination}" con "${modeloNormalizado}": similitud=${similarity}, umbral=${threshold}`);
        if (similarity <= threshold && similarity < bestSimilarityModelo) {
          bestSimilarityModelo = similarity;
          bestMatchModelo = modelo;
          marcaDetectada = marca;
        }
      }
    }
    if (bestMatchModelo) {
      modeloDetectado = bestMatchModelo;
      break;
    }
  }

  // Si no se detectó modelo, buscar marca explícitamente
  if (marcaDetectada === "no detectado") {
    let bestMarcaMatch = null;
    let bestMarcaSimilarity = Infinity;
    for (const marca in marcasModelos) {
      const marcaNormalizada = normalizeText(marca);
      const threshold = getDynamicThreshold(marcaNormalizada);
      if (mensajeNormalizado.includes(marcaNormalizada)) {
        bestMarcaMatch = marca;
        console.log(`Marca detectada (exacta): "${marca}"`);

        if (similarity <= threshold && similarity < bestMarcaSimilarity) {
          bestMarcaSimilarity = similarity;
          bestMarcaMatch = marca;
        }
      }
    }
    if (bestMarcaMatch) {
      marcaDetectada = bestMarcaMatch;
    }
  }

  // Si se detectó marca pero no modelo, buscar modelo dentro de la marca
  if (marcaDetectada !== "no detectado" && modeloDetectado === "no detectado") {

    let bestSimilarity = Infinity;
    for (const modelo of marcasModelos[marcaDetectada]) {

  // Detección de año
  const anioMatch = mensaje.match(/(?:19|20)?\d{2}(?:-\d{2})?|\b(?:año|modelo|mod)\s*(19|20)?\d{2}\b/gi);
  if (anioMatch) {
    let selectedYear = null;
    for (const match of anioMatch) {
      let year = match.replace(/[^0-9]/g, "");
      if (year.includes("-")) {
        year = year.split("-")[0]; // Tomar el primer año en rangos
      }
      if (year.length === 2) {
        year = parseInt(year) > 30 ? "19" + year : "20" + year;
      }
      if (year === "2108") year = "2018"; // Corrección específica
      if (parseInt(year) >= 1900 && parseInt(year) <= 2025) {
        selectedYear = year;

function guardarMensaje() {
  const producto = document.getElementById("producto").value;
  const marca = document.getElementById("marca").value;
  const modelo = document.getElementById("modelo").value;
  const anio = document.getElementById("anio").value;
  const vendedora = document.getElementById("vendedora").value;
  const observaciones = document.getElementById("observaciones").value;

  // Permitir guardar si el año es "no detectado", pero los demás campos están completos
  if (producto === "no detectado" || marca === "no detectado" || modelo === "no detectado" || !vendedora) {
    alert("Por favor revisa los campos. Algunos datos no se detectaron o falta seleccionar la vendedora.");
    return;
  }

  if (anio === "no detectado") {
    const confirm = window.confirm("El año no se detectó. ¿Deseas continuar guardando los datos?");
    if (!confirm) return;
  }

  fetch("https://script.google.com/macros/s/AKfycbzzMVzM4sT3_7v99DZWq3yPc5jhyWdtlaNOBDKRmbO6OqEtRcEUl__AhD_yd_R7P4Q5MQ/exec", {
    method: "POST",
    body: JSON.stringify({
      producto,
      marca,
      modelo,
      anio,
      vendedora,
      observaciones
    }),
    headers: {
      "Content-Type": "application/json"
    }
  })
    .then(response => {
      if (!response.ok) {
        throw new Error(`Error en la solicitud: ${response.status} ${response.statusText}`);
      }
      return response.text();
    })
    .then(data => {
      console.log("Respuesta del servidor:", data);
      document.getElementById("mensaje").value = "";
      document.getElementById("vendedora").value = "";
      document.getElementById("producto").value = "";
      document.getElementById("marca").value = "";
      document.getElementById("modelo").value = "";
      document.getElementById("anio").value = "";
      document.getElementById("observaciones").value = "";
      alert("Datos guardados exitosamente ✅");
    })
    .catch(err => {
      console.error("Error al enviar:", err);
      alert("Hubo un error al guardar los datos: " + err.message);
    });
}
